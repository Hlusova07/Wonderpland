<!<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wonderpland</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="app">

        <h1>Wonderpland ✦</h1>

        <p class="subtitle">Your own little wonderland</p>

        <section class="tasks">

            <h2>Мои задачи</h2>

            <div class="task">
                <input type="checkbox">
                <span>Прочитать книгу</span>
            </div>

            <div class="task completed">
                <input type="checkbox" checked>
                <span>Сделать тренировку</span>
            </div>

        </section>

        <button class="add-task" id="addTaskButton">
            + Добавить задачу
        </button>

    </main>

    <script src="/static/script.js"></script>

</body>
</html>
